<script>
    function selectOption(btn) {
        // Remove active classes from all buttons
        const buttons = document.querySelectorAll('.likert-btn');
        buttons.forEach(b => {
            b.classList.remove('active');
            const dot = b.querySelector('.inner-dot');
            dot.classList.remove('bg-on-primary', 'scale-100');
            dot.classList.add('bg-transparent', 'scale-0');
        });

        // Add active class to clicked button
        btn.classList.add('active');
        const activeDot = btn.querySelector('.inner-dot');
        activeDot.classList.remove('bg-transparent', 'scale-0');
        activeDot.classList.add('bg-white', 'scale-100');
        
        // Haptic-like effect logic would go here
    }

    document.addEventListener('DOMContentLoaded', () => {

</script>
